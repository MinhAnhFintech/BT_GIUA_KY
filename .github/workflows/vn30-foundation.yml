name: VN30 foundation
on:
  push:
    paths: ['vn30-investment-system/**', '.github/workflows/vn30-foundation.yml']
  pull_request:
    paths: ['vn30-investment-system/**', '.github/workflows/vn30-foundation.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vn30-investment-system
    env:
      VNSTOCK_DISABLE_AGENT_SETUP: '1'
      VNSTOCK_AGENT_TARGETS: none
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install '.[dev]' --extra-index-url https://vnstocks.com/api/simple
      - run: python -m pytest -q
      - run: python -m ruff check .
      - run: python -m ruff format --check .

