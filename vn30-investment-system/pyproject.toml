[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "vn30-investment-system"
version = "0.1.0"
description = "Auditable VN30 investment analysis: stage 1 foundation"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.0,<3", "PyYAML>=6.0,<7", "SQLAlchemy>=2.0,<3",
  "requests>=2.31,<3", "python-dotenv>=1.0,<2",
  "vnstock>=4.0.9", "vnai>=2.6.2",
  "fastapi>=0.115", "uvicorn>=0.30", "pandas>=2.2", "numpy>=1.26",
  "reportlab>=4.0", "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.8", "pypdf>=5"]

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

